name: Build

on:
  push:
    branches: ["master", "0.1-recovery-foundation", "0.2-background-monitor", "0.3-recovery-engine-foundation", "0.4-ntfs-volume-inspection", "0.5-ntfs-data-run-analysis", "0.6-ntfs-cluster-safety", "0.7-byte-recovery-foundation"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore FileRecovery/FileRecovery.csproj

      - name: Build
        run: dotnet build FileRecovery/FileRecovery.csproj -c Release --no-restore

      - name: Publish standalone win-x64
        run: dotnet publish FileRecovery/FileRecovery.csproj -c Release -r win-x64 --self-contained true --no-restore